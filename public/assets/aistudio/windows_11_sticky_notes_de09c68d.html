<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Notes — Windows 11 Style</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Segoe UI fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Segoe UI Variable"', '"Segoe UI"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            winBg: '#202020',
            winSurface: '#272727',
            winBtn: '#2b2b2b',
            winBtnHover: '#353535',
            winBorder: '#383838',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Windows 11 Thin Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Subtle Acrylic / Mica Backdrop Effect */
    body {
      background: radial-gradient(circle at 20% 20%, #1d192b 0%, #121214 55%, #0c0c0e 100%);
      min-height: 100vh;
      font-family: "Segoe UI Variable", "Segoe UI", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Line clamp utility */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Smooth card entrance */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-card {
      animation: fadeSlideUp 0.22s ease-out forwards;
    }

    /* Rich text editor placeholder */
    [contenteditable="true"]:empty:before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.42);
      pointer-events: none;
      display: block;
    }

    /* Custom keycap shadow for Win + Alt + S */
    .win-keycap {
      background: rgba(255, 255, 255, 0.88);
      color: #2d2638;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22), 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* Hide scrollbar for category pills */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-6 text-white selection:bg-purple-400/30">

  <!-- Docked Restore Pill (shown when window is minimized) -->
  <button id="restorePill" onclick="toggleMinimize()"
    class="hidden fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-2.5 rounded-full bg-[#242424] border border-[#3d3d3d] shadow-2xl hover:bg-[#2f2f2f] transition-all duration-200 cursor-pointer">
    <!-- Mini Sticky Note Icon -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="4" fill="#FCD116"/>
      <path d="M14 21L21 14H15.5C14.6716 14 14 14.6716 14 15.5V21Z" fill="#9B4F96"/>
    </svg>
    <span class="text-sm font-medium text-gray-100">Sticky Notes</span>
  </button>

  <!-- Main Windows 11 Sticky Notes Window Container -->
  <main id="appWindow"
    class="relative w-full max-w-[404px] h-[88vh] max-h-[840px] min-h-[580px] bg-[#202020] border border-[#353535] rounded-[12px] shadow-[0_24px_64px_rgba(0,0,0,0.68),0_0_0_1px_rgba(255,255,255,0.04)] flex flex-col overflow-hidden transition-all duration-300">

    <!-- 1. Window Title Bar -->
    <header class="h-11 px-3.5 flex items-center justify-between select-none shrink-0 bg-[#202020]">
      <!-- Left: App Icon + Title -->
      <div class="flex items-center gap-2.5">
        <!-- Yellow & Purple Folded Sticky Note App Icon -->
        <div class="w-5 h-5 flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="noteYellow" x1="2" y1="2" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFE054"/>
                <stop offset="100%" stop-color="#F5B800"/>
              </linearGradient>
              <linearGradient id="notePurple" x1="13" y1="13" x2="21" y2="21" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#A855F7"/>
                <stop offset="100%" stop-color="#6B21A8"/>
              </linearGradient>
            </defs>
            <path d="M3 5.5C3 4.11929 4.11929 3 5.5 3H18.5C19.8807 3 21 4.11929 21 5.5V14L14 21H5.5C4.11929 21 3 19.8807 3 18.5V5.5Z" fill="url(#noteYellow)"/>
            <path d="M14 21L21 14H16C14.8954 14 14 14.8954 14 16V21Z" fill="url(#notePurple)"/>
          </svg>
        </div>
        <span class="text-[13px] font-normal text-[#e6e6e6] tracking-[-0.01em]">Sticky Notes</span>
      </div>

      <!-- Right: Window Controls (..., Divider, Minimize, Close) -->
      <div class="flex items-center">
        <!-- Three-dots Menu Trigger -->
        <div class="relative">
          <button id="menuBtn" onclick="toggleAppMenu(event)" title="More options"
            class="w-9 h-8 rounded-[6px] flex items-center justify-center text-[#d4d4d4] hover:bg-white/[0.07] active:bg-white/[0.04] transition-colors">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="3.2" cy="8" r="1.15"/>
              <circle cx="8" cy="8" r="1.15"/>
              <circle cx="12.8" cy="8" r="1.15"/>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div id="appMenuDropdown"
            class="hidden absolute right-0 top-9 w-52 bg-[#2c2c2c] border border-[#424242] rounded-[8px] shadow-2xl py-1.5 z-50 text-[13px] text-[#efefef]">
            <button onclick="openComposerModal()" class="w-full px-3.5 py-2 text-left hover:bg-white/[0.08] flex items-center gap-2.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span>New sticky note</span>
            </button>
            <button onclick="triggerScreenshotCapture()" class="w-full px-3.5 py-2 text-left hover:bg-white/[0.08] flex items-center gap-2.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2m8-16h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span>Quick screenshot note</span>
            </button>
            <div class="my-1 border-t border-white/10"></div>
            <button onclick="resetDemoNotes()" class="w-full px-3.5 py-2 text-left hover:bg-white/[0.08] text-purple-300 flex items-center gap-2.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              <span>Reset Demo Notes</span>
            </button>
          </div>
        </div>

        <!-- Subtle Vertical Divider -->
        <div class="w-[1px] h-4 bg-[#383838] mx-1.5"></div>

        <!-- Minimize Button -->
        <button onclick="toggleMinimize()" title="Minimize"
          class="w-10 h-8 rounded-[6px] flex items-center justify-center text-[#d4d4d4] hover:bg-white/[0.07] transition-colors">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="1.5" y1="6" x2="10.5" y2="6"/>
          </svg>
        </button>

        <!-- Close Button (Triggers subtle toast/minimize simulation) -->
        <button onclick="handleCloseWindow()" title="Close"
          class="w-10 h-8 rounded-[6px] flex items-center justify-center text-[#d4d4d4] hover:bg-[#c42b1c] hover:text-white transition-colors">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="2" y1="2" x2="10" y2="10"/>
            <line x1="10" y1="2" x2="2" y2="10"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- VIEW 1: MAIN NOTES LIST VIEW -->
    <div id="listView" class="flex-1 flex flex-col overflow-hidden">
      <!-- 2. Action Toolbar (+ Note & Screenshot) -->
      <div class="px-4 pt-1.5 pb-2.5 grid grid-cols-2 gap-2.5 shrink-0">
        <!-- + Note Button -->
        <button onclick="openComposerModal()"
          class="h-[42px] px-3 rounded-[8px] bg-[#2b2b2b] hover:bg-[#343434] active:bg-[#262626] border border-[#3d3d3d] flex items-center justify-center gap-2 text-[13.5px] font-medium text-white transition-all duration-150 shadow-sm cursor-pointer">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="8" y1="2.5" x2="8" y2="13.5"/>
            <line x1="2.5" y1="8" x2="13.5" y2="8"/>
          </svg>
          <span>Note</span>
        </button>

        <!-- Screenshot Button -->
        <button onclick="triggerScreenshotCapture()"
          class="h-[42px] px-3 rounded-[8px] bg-[#2b2b2b] hover:bg-[#343434] active:bg-[#262626] border border-[#3d3d3d] flex items-center justify-center gap-2 text-[13.5px] font-medium text-white transition-all duration-150 shadow-sm cursor-pointer">
          <!-- Windows Snip / Viewfinder Icon -->
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M2.5 6V4C2.5 3.17157 3.17157 2.5 4 2.5H6"/>
            <path d="M12 2.5H14C14.8284 2.5 15.5 3.17157 15.5 4V6"/>
            <path d="M15.5 12V14C15.5 14.8284 14.8284 15.5 14 15.5H12"/>
            <path d="M6 15.5H4C3.17157 15.5 2.5 14.8284 2.5 14V12"/>
            <rect x="5.5" y="5.5" width="7" height="7" rx="1.5" stroke-width="1.3"/>
          </svg>
          <span>Screenshot</span>
        </button>
      </div>

      <!-- 2.5 Category Filter Tabs -->
      <div class="px-4 pb-2 shrink-0">
        <div id="categoryTabsBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
          <!-- Category tabs dynamically injected here -->
        </div>
        <!-- Inline Add Category Input (Hidden by default) -->
        <div id="newCategoryBar" class="hidden mt-2 flex items-center gap-1.5">
          <input id="newCategoryInput" type="text" maxlength="20"
            onkeydown="if(event.key==='Enter') confirmAddCategory(); if(event.key==='Escape') toggleNewCategoryInput(false);"
            placeholder="New category name..."
            class="flex-1 h-8 px-2.5 rounded-[7px] bg-[#2b2b2b] border border-[#454545] focus:border-[#c58af9] focus:outline-none text-[12px] text-white placeholder-[#8e8e8e]" />
          <button type="button" onclick="confirmAddCategory()"
            class="h-8 px-2.5 rounded-[7px] bg-[#c58af9] hover:bg-[#d2a1fb] text-[#1c1326] font-semibold text-[11.5px] transition-colors">
            Add
          </button>
          <button type="button" onclick="toggleNewCategoryInput(false)"
            class="h-8 px-2 rounded-[7px] bg-[#2b2b2b] hover:bg-[#353535] text-gray-300 text-[11.5px] transition-colors">
            Cancel
          </button>
        </div>
      </div>

      <!-- 3. Section Header & Expandable Search -->
      <div class="px-4 pb-2.5 shrink-0">
        <div class="flex items-center justify-between h-8">
          <span id="recentNotesLabel" class="text-[13px] font-normal text-[#d4d4d4]">Recent notes</span>
          <div class="flex items-center gap-1">
            <button id="searchToggleBtn" onclick="toggleSearch()" title="Search notes"
              class="w-8 h-8 rounded-[6px] flex items-center justify-center text-[#cccccc] hover:bg-white/[0.08] transition-colors">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="7" cy="7" r="4.8"/>
                <line x1="10.6" y1="10.6" x2="14" y2="14"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Inline Search Bar (Hidden by default) -->
        <div id="searchBarContainer" class="hidden mt-1.5 transition-all">
          <div class="relative flex items-center">
            <input id="searchInput" type="text" oninput="handleSearch(this.value)"
              placeholder="Search by title, tag, or content..."
              class="w-full h-9 pl-3 pr-8 rounded-[7px] bg-[#2b2b2b] border border-[#454545] focus:border-[#c58af9] focus:outline-none text-[13px] text-white placeholder-[#8e8e8e]" />
            <button onclick="clearSearch()" title="Clear search"
              class="absolute right-2 text-[#9e9e9e] hover:text-white p-1">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                <line x1="3" y1="3" x2="11" y2="11"/>
                <line x1="11" y1="3" x2="3" y2="11"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 4. Scrollable Sticky Notes Feed -->
      <div id="notesFeed" class="flex-1 overflow-y-auto px-4 pb-5 space-y-3.5">
        <!-- Cards dynamically injected here -->
      </div>
    </div>

    <!-- VIEW 2: EXPANDED NOTE DETAIL / LIVE EDITOR VIEW -->
    <div id="detailView" class="hidden flex-1 flex flex-col overflow-hidden bg-[#202020]">
      <!-- Detail Top Bar -->
      <div class="px-3.5 py-2 flex items-center justify-between border-b border-white/[0.07] shrink-0">
        <button onclick="closeDetailView()"
          class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-[6px] text-[13px] text-[#e0e0e0] hover:bg-white/[0.08] transition-colors">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M10 3L5 8l5 5"/>
          </svg>
          <span>Recent notes</span>
        </button>

        <!-- Color Swatches in Detail View -->
        <div id="detailColorSwatches" class="flex items-center gap-1.5">
          <!-- Swatches injected by JS -->
        </div>

        <div class="flex items-center gap-1">
          <button onclick="copyActiveNote()" title="Copy note text"
            class="p-1.5 rounded-[6px] text-[#cccccc] hover:bg-white/[0.08] hover:text-white transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button onclick="deleteActiveNote()" title="Delete note"
            class="p-1.5 rounded-[6px] text-[#cccccc] hover:bg-red-500/20 hover:text-red-300 transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Active Note Card Canvas -->
      <div id="detailCardContainer" class="flex-1 overflow-y-auto p-4">
        <div id="detailCardSurface" class="rounded-[10px] overflow-hidden shadow-lg transition-colors duration-200 flex flex-col min-h-full">
          <!-- Top 4px Accent Strip -->
          <div id="detailAccentStrip" class="h-[4px] w-full"></div>

          <div class="p-4 flex-1 flex flex-col">
            <!-- Editable Category Dropdown & Date -->
            <div class="flex items-center justify-between text-[12px] text-white/80 mb-3">
              <div class="relative inline-flex items-center">
                <select id="detailCategorySelect" onchange="saveDetailEdits()"
                  class="appearance-none bg-black/25 hover:bg-black/35 border border-white/15 rounded-[6px] pl-2.5 pr-6 py-1 text-[12px] font-medium text-white focus:outline-none focus:border-white/40 cursor-pointer transition-colors">
                  <!-- Options injected dynamically -->
                </select>
                <svg class="pointer-events-none absolute right-2 text-white/75" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 6l4 4 4-4"/>
                </svg>
              </div>
              <span id="detailDateLabel" class="text-white/80">10/29/2026</span>
            </div>

            <!-- Optional Banner / Attached Image -->
            <div id="detailBannerWrapper" class="mb-3.5 rounded-[8px] overflow-hidden"></div>

            <!-- Editable Title -->
            <input id="detailTitleInput" type="text" oninput="saveDetailEdits()"
              class="w-full bg-transparent text-[17px] font-bold text-white focus:outline-none mb-2 placeholder-white/40"
              placeholder="Note title..." />

            <!-- Editable Rich Body -->
            <div id="detailBodyEditor" contenteditable="true" oninput="saveDetailEdits()"
              data-placeholder="Take a note..."
              class="flex-1 text-[13.5px] leading-[1.55] text-white/90 focus:outline-none whitespace-pre-wrap break-words"></div>
          </div>

          <!-- Rich Text Formatting Toolbar at Bottom of Note -->
          <div class="px-3 py-2 bg-black/20 border-t border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-1">
              <button type="button" onclick="formatDoc('bold')" title="Bold"
                class="w-7 h-7 rounded hover:bg-white/15 flex items-center justify-center font-bold text-xs text-white">B</button>
              <button type="button" onclick="formatDoc('italic')" title="Italic"
                class="w-7 h-7 rounded hover:bg-white/15 flex items-center justify-center italic font-serif text-sm text-white">I</button>
              <button type="button" onclick="formatDoc('underline')" title="Underline"
                class="w-7 h-7 rounded hover:bg-white/15 flex items-center justify-center underline text-xs text-white">U</button>
              <button type="button" onclick="formatDoc('insertUnorderedList')" title="Bulleted list"
                class="w-7 h-7 rounded hover:bg-white/15 flex items-center justify-center text-white">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                  <circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
                </svg>
              </button>
            </div>
            <span id="saveStatusText" class="text-[11px] text-white/55">Saved</span>
          </div>
        </div>
      </div>
    </div>

    <!-- INLINE COMPOSER MODAL (+ Note) -->
    <div id="composerModal" class="hidden absolute inset-0 z-40 bg-black/65 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-3">
      <div class="w-full bg-[#262626] border border-[#3e3e3e] rounded-[12px] shadow-2xl overflow-hidden animate-card">
        <!-- Accent bar preview -->
        <div id="composerAccentPreview" class="h-[4px] w-full bg-[#c58af9] transition-colors"></div>

        <div class="p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-[14px] font-semibold text-white">New Sticky Note</h3>
            <button onclick="closeComposerModal()" class="text-gray-400 hover:text-white p-1 rounded">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                <line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/>
              </svg>
            </button>
          </div>

          <!-- Theme Picker -->
          <div class="mb-3">
            <label class="block text-[11.5px] text-gray-400 mb-1.5">Note color</label>
            <div id="composerThemePicker" class="flex items-center gap-2">
              <!-- Populated via JS -->
            </div>
          </div>

          <!-- Category & Banner Selector -->
          <div class="grid grid-cols-2 gap-2.5 mb-2.5">
            <div>
              <label class="block text-[11.5px] text-gray-400 mb-1">Category</label>
              <select id="newNoteCategory"
                class="w-full h-8 px-2 rounded-[6px] bg-[#1e1e1e] border border-[#3b3b3b] focus:border-[#c58af9] focus:outline-none text-[12.5px] text-white">
                <!-- Populated dynamically -->
              </select>
            </div>
            <div>
              <label class="block text-[11.5px] text-gray-400 mb-1">Header graphic</label>
              <select id="newNoteBanner"
                class="w-full h-8 px-2 rounded-[6px] bg-[#1e1e1e] border border-[#3b3b3b] focus:border-[#c58af9] focus:outline-none text-[12.5px] text-white">
                <option value="none">None (Text only)</option>
                <option value="banner-screenshot">1-Click Capture Graphic</option>
                <option value="banner-source">Source Link Graphic</option>
                <option value="banner-shortcut">Win+Alt+S Shortcut Graphic</option>
                <option value="banner-snapshot">Desktop Snapshot</option>
              </select>
            </div>
          </div>

          <!-- Title -->
          <div class="mb-2.5">
            <input id="newNoteTitle" type="text" placeholder="Title (e.g., Project ideas)"
              class="w-full h-9 px-3 rounded-[6px] bg-[#1e1e1e] border border-[#3b3b3b] focus:border-[#c58af9] focus:outline-none text-[13.5px] font-semibold text-white placeholder-gray-500" />
          </div>

          <!-- Body -->
          <div class="mb-3">
            <textarea id="newNoteBody" rows="3" placeholder="Write your note here..."
              class="w-full p-3 rounded-[6px] bg-[#1e1e1e] border border-[#3b3b3b] focus:border-[#c58af9] focus:outline-none text-[13px] text-white placeholder-gray-500 resize-none"></textarea>
          </div>

          <!-- Optional Image URL / File Upload -->
          <div class="mb-4 flex items-center justify-between gap-2">
            <label class="flex items-center gap-1.5 text-[12px] text-purple-300 hover:text-purple-200 cursor-pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span id="uploadLabelText">Attach custom image...</span>

    // =========================================================================

    const STORAGE_KEY = 'win11_sticky_notes_v2';

    let notes = [];

    function loadNotes() {
      try {
        const savedCats = localStorage.getItem(CATEGORIES_STORAGE_KEY);
        if (savedCats) {
          const parsedCats = JSON.parse(savedCats);
          if (Array.isArray(parsedCats) && parsedCats.length > 0) {
            categories = parsedCats;
          }
        }

        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            notes = parsed;
            return;
          }
        }
      } catch (err) {
        console.warn('Could not load from localStorage:', err);
      }
      categories = [...DEFAULT_CATEGORIES];
      notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
      saveNotes();
    }

    function saveNotes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));

      if (labelEl) {
        labelEl.textContent = activeCategory === 'All' ? 'Recent notes' : `${activeCategory} notes`;
      }

      activeCategory = cat;
      renderCategoryTabs();
      renderNotes();

    function toggleNewCategoryInput(show) {
      const container = document.getElementById('newCategoryBar');
      const input = document.getElementById('newCategoryInput');
      if (show) {
        container.classList.remove('hidden');
        input.value = '';
        input.focus();
      } else {
        container.classList.add('hidden');
        input.value = '';
      }

    function confirmAddCategory() {
      const input = document.getElementById('newCategoryInput');
      const raw = input.value.trim();
      if (!raw) {
        toggleNewCategoryInput(false);
        return;
      }

      const formatted = raw.charAt(0).toUpperCase() + raw.slice(1);
      const exists = categories.some(c => c.toLowerCase() === formatted.toLowerCase()) || formatted.toLowerCase() === 'all';

      if (!exists) {
        categories.push(formatted);
        saveNotes();
        showToast(`Added "${formatted}" tab`);
      }

      activeCategory = exists
        ? (categories.find(c => c.toLowerCase() === formatted.toLowerCase()) || 'All')
        : formatted;

      toggleNewCategoryInput(false);
      renderCategoryTabs();
      renderNotes();
    }

    function renderNotes() {
      const feed = document.getElementById('notesFeed');
      const query = searchQuery.trim().toLowerCase();

      const filtered = notes.filter(note => {
        const matchesCategory =
          activeCategory === 'All' ||
          (note.category || '').toLowerCase() === activeCategory.toLowerCase();

        if (!matchesCategory) return false;
        if (!query) return true;

        const plainBody = stripHtml(note.body).toLowerCase();
        return (
          note.title.toLowerCase().includes(query) ||
          note.category.toLowerCase().includes(query) ||
          plainBody.includes(query)
        );
      });

        feed.innerHTML = `
          <div class="py-16 px-4 text-center text-[#9e9e9e]">
            <p class="text-[13.5px] mb-1">No notes in ${escapeHtml(activeCategory)}</p>
            <p class="text-[12px] text-[#757575]">Click "+ Note" above to create one in this category.</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = filtered.map(note => {
        const theme = NOTE_THEMES[note.theme] || NOTE_THEMES.purple;
        const hasBanner = note.customImage || (note.bannerType && note.bannerType !== 'none');

        let bannerHTML = '';
        if (note.customImage) {
          bannerHTML = `
            <div class="mb-3 rounded-[7px] overflow-hidden bg-black/20">
              <img src="${note.customImage}" alt="${escapeHtml(note.title)}"
                onerror="this.src='https://placehold.co/340x126/3b2d4a/e9d5ff?text=Snapshot'"
                class="w-full h-[126px] object-cover block" />
            </div>`;
        } else if (hasBanner) {
          bannerHTML = `
            <div class="mb-3 rounded-[7px] overflow-hidden shadow-sm">
              ${getIllustrationSVG(note.bannerType)}
            </div>`;
        }

        // Swatch buttons for quick hover theme switching
        const swatchButtons = Object.values(NOTE_THEMES).map(t => `
          <button type="button"
            onclick="changeNoteTheme(event, '${note.id}', '${t.id}')"
            title="${t.name}"
            style="background-color: ${t.accent};"
            class="w-3.5 h-3.5 rounded-full border border-black/30 hover:scale-125 transition-transform ${note.theme === t.id ? 'ring-2 ring-white' : ''}">
          </button>
        `).join('');

        return `
          <article onclick="openDetailView('${note.id}')"
            style="background-color: ${theme.bg};"
            class="group relative rounded-[10px] overflow-hidden cursor-pointer shadow-[0_4px_14px_rgba(0,0,0,0.28)] hover:brightness-105 transition-all duration-150 animate-card">

            <!-- Top 4px Colored Accent Strip -->
            <div style="background-color: ${theme.accent};" class="h-[4px] w-full"></div>

            <!-- Card Inner Content -->
            <div class="px-3.5 pt-2.5 pb-3.5">
              <!-- Top Metadata Row -->
              <div class="flex items-center justify-between text-[12px] text-white/85 mb-2.5">
                <span class="font-normal tracking-[0.01em]">${escapeHtml(note.category || 'Note')}</span>

                <div class="flex items-center gap-2">
                  <!-- Hover Quick Actions (Color Swatches + Delete) -->
                  <div class="hidden group-hover:flex items-center gap-1.5 bg-black/30 backdrop-blur-sm px-2 py-0.5 rounded-full">
                    ${swatchButtons}
                    <span class="w-[1px] h-3 bg-white/20 mx-0.5"></span>
                    <button type="button" onclick="deleteNoteById(event, '${note.id}')" title="Delete note"
                      class="text-white/80 hover:text-red-300 transition-colors">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                      </svg>
                    </button>
                  </div>

                  <!-- Date Label -->
                  <span class="text-white/80 group-hover:hidden text-[12px]">${escapeHtml(note.date)}</span>
                </div>
              </div>

              <!-- Optional Illustration Banner / Image -->
              ${bannerHTML}

              <!-- Bold Title -->
              <h2 class="text-[14.5px] font-bold text-white leading-[1.3] mb-1 tracking-[-0.01em]">
                ${escapeHtml(note.title || 'Untitled note')}
              </h2>

              <!-- 2-Line Clamped Body Preview -->
              <p class="text-[13px] text-white/85 leading-[1.42] line-clamp-2">
                ${escapeHtml(stripHtml(note.body))}
              </p>
            </div>
          </article>
        `;
      }).join('');
    }

    // =========================================================================
    // 6. EXPANDED NOTE DETAIL / LIVE EDITOR
    // =========================================================================
    function openDetailView(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;

      activeNoteId = id;
      const theme = NOTE_THEMES[note.theme] || NOTE_THEMES.purple;

      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');

      // Apply theme colors
      document.getElementById('detailCardSurface').style.backgroundColor = theme.bg;
      document.getElementById('detailAccentStrip').style.backgroundColor = theme.accent;

      // Render swatch controls in top bar
      const swatchContainer = document.getElementById('detailColorSwatches');
      swatchContainer.innerHTML = Object.values(NOTE_THEMES).map(t => `
        <button type="button" onclick="setActiveNoteTheme('${t.id}')" title="${t.name}"
          style="background-color: ${t.accent};"
          class="w-4 h-4 rounded-full border border-black/40 hover:scale-110 transition-transform ${note.theme === t.id ? 'ring-2 ring-white' : ''}">
        </button>
      `).join('');

      // Populate category select dropdown
      const catSelect = document.getElementById('detailCategorySelect');
      const allAvailableCats = [...new Set([...categories, note.category || 'Tips'])];
      catSelect.innerHTML = allAvailableCats.map(c =>
        `<option value="${escapeHtml(c)}" class="bg-[#262626] text-white" ${c === note.category ? 'selected' : ''}>${escapeHtml(c)}</option>`
      ).join('');

      document.getElementById('detailDateLabel').textContent = note.date || '';
      document.getElementById('detailTitleInput').value = note.title || '';
      document.getElementById('detailBodyEditor').innerHTML = note.body || '';

      // Populate banner if present
      const bannerWrapper = document.getElementById('detailBannerWrapper');
      if (note.customImage) {
        bannerWrapper.classList.remove('hidden');
        bannerWrapper.innerHTML = `<img src="${note.customImage}" class="w-full max-h-44 object-cover rounded-[7px]" />`;
      } else if (note.bannerType && note.bannerType !== 'none') {
        bannerWrapper.classList.remove('hidden');
        bannerWrapper.innerHTML = getIllustrationSVG(note.bannerType);
      } else {
        bannerWrapper.classList.add('hidden');
        bannerWrapper.innerHTML = '';
      }
    }

    function closeDetailView() {
      activeNoteId = null;
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('listView').classList.remove('hidden');
      renderCategoryTabs();
      renderNotes();
    }

    function saveDetailEdits() {
      if (!activeNoteId) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;

      note.category = document.getElementById('detailCategorySelect').value || 'Tips';
      note.title = document.getElementById('detailTitleInput').value;
      note.body = document.getElementById('detailBodyEditor').innerHTML;

      saveNotes();
      renderCategoryTabs();

      const status = document.getElementById('saveStatusText');
      status.textContent = 'Saving...';
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => {
        status.textContent = 'Saved';
      }, 450);
    }

    function setActiveNoteTheme(themeId) {
      if (!activeNoteId) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;
      note.theme = themeId;
      saveNotes();
      openDetailView(activeNoteId);
    }

    function formatDoc(cmd) {
      document.getElementById('detailBodyEditor').focus();
      document.execCommand(cmd, false, null);
      saveDetailEdits();
    }

    function copyActiveNote() {
      if (!activeNoteId) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;

      const textToCopy = `${note.title}\n${stripHtml(note.body)}`;
      const tempArea = document.createElement('textarea');
      tempArea.value = textToCopy;
      document.body.appendChild(tempArea);
      tempArea.select();
      document.execCommand('copy');
      document.body.removeChild(tempArea);

      showToast('Copied note to clipboard');
    }

    function deleteActiveNote() {
      if (!activeNoteId) return;
      notes = notes.filter(n => n.id !== activeNoteId);
      saveNotes();
      closeDetailView();
      renderCategoryTabs();
      showToast('Sticky note deleted');
    }

    // =========================================================================
    // 7. QUICK CARD ACTIONS (Theme & Delete)
    // =========================================================================
    function changeNoteTheme(event, id, themeId) {
      event.stopPropagation();
      const note = notes.find(n => n.id === id);
      if (!note) return;
      note.theme = themeId;
      saveNotes();
      renderNotes();
    }

    function deleteNoteById(event, id) {
      event.stopPropagation();
      notes = notes.filter(n => n.id !== id);
      saveNotes();
      renderCategoryTabs();
      renderNotes();
      showToast('Note removed');
    }

    // =========================================================================
    // 8. NEW NOTE COMPOSER MODAL & SCREENSHOT SIMULATION
    // =========================================================================
    function openComposerModal() {
      closeAppMenu();
      selectedComposerTheme = 'purple';
      uploadedImageDataUrl = null;

      // Populate category dropdown & default to activeCategory (or 'Ideas' if on 'All')
      const catSelect = document.getElementById('newNoteCategory');
      const defaultCat = activeCategory === 'All' ? 'Ideas' : activeCategory;
      catSelect.innerHTML = categories.map(c =>
        `<option value="${escapeHtml(c)}" ${c === defaultCat ? 'selected' : ''}>${escapeHtml(c)}</option>`
      ).join('');

      document.getElementById('newNoteBanner').value = 'none';
      document.getElementById('newNoteTitle').value = '';
      document.getElementById('newNoteBody').value = '';
      document.getElementById('uploadLabelText').textContent = 'Attach custom image...';
      document.getElementById('clearUploadBtn').classList.add('hidden');
      document.getElementById('composerAccentPreview').style.backgroundColor = NOTE_THEMES.purple.accent;

      renderComposerSwatches();
      document.getElementById('composerModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('newNoteTitle').focus(), 50);
    }

    function closeComposerModal() {
      document.getElementById('composerModal').classList.add('hidden');
    }

    function renderComposerSwatches() {
      const container = document.getElementById('composerThemePicker');
      container.innerHTML = Object.values(NOTE_THEMES).map(t => `
        <button type="button" onclick="selectComposerTheme('${t.id}')"
          style="background-color: ${t.accent};"
          class="w-6 h-6 rounded-full flex items-center justify-center transition-transform hover:scale-110 ${selectedComposerTheme === t.id ? 'ring-2 ring-white ring-offset-2 ring-offset-[#262626]' : ''}">
        </button>
      `).join('');
    }

    function selectComposerTheme(themeId) {
      selectedComposerTheme = themeId;
      document.getElementById('composerAccentPreview').style.backgroundColor = NOTE_THEMES[themeId].accent;
      renderComposerSwatches();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedImageDataUrl = e.target.result;
        document.getElementById('uploadLabelText').textContent = file.name.slice(0, 22);
        document.getElementById('clearUploadBtn').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearUploadedImage() {
      uploadedImageDataUrl = null;
      document.getElementById('newNoteImageInput').value = '';
      document.getElementById('uploadLabelText').textContent = 'Attach custom image...';
      document.getElementById('clearUploadBtn').classList.add('hidden');
    }

    function createNewNote() {
      const title = document.getElementById('newNoteTitle').value.trim() || 'Quick Note';
      const category = document.getElementById('newNoteCategory').value.trim() || 'Note';
      const body = document.getElementById('newNoteBody').value.trim() || 'Tap to edit this sticky note...';
      const bannerType = document.getElementById('newNoteBanner').value;

      const newNote = {
        id: 'note-' + Date.now(),
        theme: selectedComposerTheme,
        category,
        date: getFormattedToday(),
        bannerType: uploadedImageDataUrl ? 'none' : bannerType,
        customImage: uploadedImageDataUrl,
        title,
        body: escapeHtml(body).replace(/\n/g, '<br>')
      };

      notes.unshift(newNote);
      saveNotes();
      closeComposerModal();
      renderCategoryTabs();
      renderNotes();
      showToast(`Added to ${category}`);
    }

    function triggerScreenshotCapture() {
      closeAppMenu();
      const flash = document.getElementById('screenshotFlash');
      flash.classList.remove('hidden');
      flash.style.opacity = '0.85';

      setTimeout(() => {
        flash.style.opacity = '0';
        setTimeout(() => flash.classList.add('hidden'), 260);
      }, 90);

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const targetCategory = activeCategory === 'All' ? 'Tips' : activeCategory;

      const snipNote = {
        id: 'note-' + Date.now(),
        theme: 'blue',
        category: targetCategory,
        date: getFormattedToday(),
        bannerType: 'banner-snapshot',
        customImage: null,
        title: `Screen capture (${timeStr})`,
        body: 'Captured via Sticky Notes 1-click snip. Click to annotate or add details about this screen snapshot.'
      };

      notes.unshift(snipNote);
      saveNotes();

      if (!document.getElementById('detailView').classList.contains('hidden')) {
        closeDetailView();
      } else {
        renderCategoryTabs();
        renderNotes();
      }

      showToast(`1-click screenshot saved to ${targetCategory}!`);
    }

    // =========================================================================
    // 9. SEARCH & WINDOW CONTROLS
    // =========================================================================
    function toggleSearch() {
      const bar = document.getElementById('searchBarContainer');
      const input = document.getElementById('searchInput');
      const isHidden = bar.classList.contains('hidden');

      if (isHidden) {
        bar.classList.remove('hidden');
        input.focus();
      } else {
        clearSearch();
        bar.classList.add('hidden');
      }
    }

    function handleSearch(val) {
      searchQuery = val;
      renderNotes();
    }

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      renderNotes();
    }

    function toggleAppMenu(e) {
      e.stopPropagation();
      document.getElementById('appMenuDropdown').classList.toggle('hidden');
    }

    function closeAppMenu() {
      document.getElementById('appMenuDropdown').classList.add('hidden');
    }

    function resetDemoNotes() {
      closeAppMenu();
      categories = [...DEFAULT_CATEGORIES];
      activeCategory = 'All';
      notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
      saveNotes();
      if (!document.getElementById('detailView').classList.contains('hidden')) {
        closeDetailView();
      } else {
        renderCategoryTabs();
        renderNotes();
      }
      showToast('Restored default demo notes & tabs');
    }

    function toggleMinimize() {
      const win = document.getElementById('appWindow');
      const pill = document.getElementById('restorePill');
      const isMinimized = win.classList.contains('hidden');

      if (isMinimized) {
        win.classList.remove('hidden');
        pill.classList.add('hidden');
      } else {
        win.classList.add('hidden');
        pill.classList.remove('hidden');
      }
    }

    function handleCloseWindow() {
      toggleMinimize();
    }

    // =========================================================================
    // 10. HELPERS
    // =========================================================================
    function getFormattedToday() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${mm}/${dd}/${yyyy}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      return tmp.textContent || tmp.innerText || '';
    }

    function showToast(msg) {
      const toast = document.getElementById('toastBanner');
      document.getElementById('toastMessage').textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('appMenuDropdown');
      const btn = document.getElementById('menuBtn');
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        closeAppMenu();
      }
    });

    // Keyboard shortcut listener (Alt + S or Ctrl/Cmd + K for search)
    document.addEventListener('keydown', (e) => {
      if (e.altKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (document.getElementById('appWindow').classList.contains('hidden')) {
          toggleMinimize();
        }
        openComposerModal();
      }
    });

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      loadNotes();
      renderCategoryTabs();
      renderNotes();
    });
  </script>
</body>
</html>
