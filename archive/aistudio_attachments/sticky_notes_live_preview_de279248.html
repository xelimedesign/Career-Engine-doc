<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes — Career Engine & Detachable Window Demo</title>
    <style>
      /* ======================================================================
         1. HOST APP (CAREER ENGINE / SLATE) STYLES
         ====================================================================== */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e1b2e 0%, #111318 55%, #0b0d11 100%);
        color: #e5e7eb;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-x: hidden;
      }

      body.sn-popout-mode {
        padding: 0;
        background: #202020;
        display: block;
      }

      .slate-host {
        max-width: 540px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .slate-host h1 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #ffffff;
      }

      .slate-host p {
        margin: 0 0 16px;
        font-size: 13.5px;
        line-height: 1.55;
        color: #9ca3af;
      }

      .slate-tips {
        margin: 0 0 18px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(197, 138, 249, 0.08);
        border: 1px solid rgba(197, 138, 249, 0.24);
        font-size: 12.5px;
        line-height: 1.5;
        color: #e9d5ff;
      }

      .slate-tips strong {
        color: #ffffff;
      }

      .slate-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .slate-btn {
        padding: 8px 13px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .slate-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .slate-btn-primary {
        background: #c58af9;
        color: #1c1326;
        border-color: #c58af9;
        font-weight: 600;
      }

      .slate-btn-primary:hover {
        background: #d2a1fb;
      }

      .slate-log {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.38);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #d8b4fe;
        min-height: 38px;
      }

      /* Subtle Prototype Workspace Watermark Hint */
      .sn-workspace-hint {
        position: fixed;
        bottom: 18px;
        left: 20px;
        padding: 7px 13px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
        pointer-events: none;
        z-index: 1;
      }

      /* Viewport Edge Tear-Out Drop Zone Guide */
      .sn-edge-guide {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9990;
        border: 3px dashed rgba(197, 138, 249, 0.85);
        background: radial-gradient(circle at center, transparent 65%, rgba(197, 138, 249, 0.16) 100%);
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .sn-edge-guide.sn-active {
        opacity: 1;
      }

      .sn-edge-badge {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: #c58af9;
        color: #1c1326;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 9999px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      }

      /* ======================================================================
         2. STICKY NOTES FLOATING WINDOW & DRAGGABLE MINIMIZED PILL
         ====================================================================== */
      .sn-window,
      .sn-window *,
      .sn-window *::before,
      .sn-window *::after,
      .sn-restore-pill {
        box-sizing: border-box;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      .sn-hidden {
        display: none !important;
      }

      .sn-window {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9998;
        width: 396px;
        max-width: calc(100vw - 24px);
        height: 82vh;
        max-height: 800px;
        min-height: 520px;
        background: #202020;
        border: 1px solid #363636;
        border-radius: 12px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }

      .sn-window.sn-dragging {
        user-select: none;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.85), 0 0 0 1.5px #c58af9;
      }

      .sn-window.sn-popout-full {
        position: fixed;
        inset: 0 !important;
        width: 100vw !important;
        max-width: 100vw !important;
        height: 100vh !important;
        max-height: 100vh !important;
        border-radius: 0;
        border: none;
      }

      /* Draggable Minimized Pill */
      .sn-restore-pill {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 9999px;
        background: #242424;
        border: 1px solid #424242;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        color: #f3f4f6;
        font-size: 13.5px;
        font-weight: 500;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .sn-restore-pill:hover {
        background: #2f2f2f;
        border-color: #c58af9;
      }

      .sn-restore-pill:active {
        cursor: grabbing;
      }

      .sn-pill-hint {
        font-size: 11px;
        color: #a1a1aa;
        margin-left: 2px;
      }

      /* Title Bar */
      .sn-titlebar {
        height: 44px;
        padding: 0 10px 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #202020;
        user-select: none;
        touch-action: none;
        cursor: grab;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .sn-titlebar:active {
        cursor: grabbing;
      }

      .sn-title-left {
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }

      .sn-app-title {
        font-size: 13px;
        font-weight: 500;
        color: #e6e6e6;
        letter-spacing: -0.01em;
      }

      .sn-sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
      }

      .sn-window-controls {
        display: flex;
        align-items: center;
        position: relative;
      }

      .sn-ctrl-btn {
        width: 34px;
        height: 30px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #d4d4d4;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease;
      }

      .sn-ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }

      .sn-ctrl-btn.sn-ctrl-close:hover {
        background: #c42b1c;
        color: #ffffff;
      }

      .sn-ctrl-divider {
        width: 1px;
        height: 16px;
        background: #383838;
        margin: 0 4px;
      }

      /* Dropdown Menu (...) */
      .sn-menu-dropdown {
        position: absolute;
        right: 72px;
        top: 34px;
        width: 215px;
        background: #2c2c2c;
        border: 1px solid #424242;
        border-radius: 8px;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
        padding: 5px 0;
        z-index: 60;
      }

      .sn-menu-item {
        width: 100%;
        padding: 8px 14px;
        border: none;
        background: transparent;
        color: #efefef;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .sn-menu-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .sn-menu-item.sn-accent-text {
        color: #d8b4fe;
      }

      .sn-menu-sep {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin: 4px 0;
      }

      /* Views */
      .sn-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Action Toolbar (+ Note & Screenshot) */
      .sn-toolbar {
        padding: 8px 16px 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex-shrink: 0;
      }

      .sn-action-btn {
        height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        background: #2b2b2b;
        border: 1px solid #3d3d3d;
        color: #ffffff;
        font-size: 13.5px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .sn-action-btn:hover {
        background: #353535;
      }

      /* Category Filter Tabs */
      .sn-tabs-section {
        padding: 0 16px 8px;
        flex-shrink: 0;
      }

      .sn-tabs-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0;
        scrollbar-width: none;
      }

      .sn-tabs-bar::-webkit-scrollbar {
        display: none;
      }

      .sn-cat-tab {
        flex-shrink: 0;
        height: 28px;
        padding: 0 11px;
        border-radius: 9999px;
        background: #2b2b2b;
        border: 1px solid #3a3a3a;
        color: #c7c7c7;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .sn-cat-tab:hover {
        background: #343434;
        color: #ffffff;
      }

      .sn-cat-tab.sn-active {
        background: rgba(197, 138, 249, 0.2);
        border-color: #c58af9;
        color: #ead6ff;
      }

      .sn-cat-count {
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        color: #9e9e9e;
      }

      .sn-cat-tab.sn-active .sn-cat-count {
        background: rgba(197, 138, 249, 0.25);
        color: #f3e8ff;
      }

      .sn-add-cat-btn {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        background: #2b2b2b;
        border: 1px solid #3a3a3a;
        color: #d4d4d4;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .sn-add-cat-btn:hover {
        background: #363636;
        color: #ffffff;
      }

      .sn-new-cat-row {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .sn-input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border-radius: 7px;
        background: #2b2b2b;
        border: 1px solid #454545;
        color: #ffffff;
        font-size: 12.5px;
        outline: none;
      }

      .sn-input:focus {
        border-color: #c58af9;
      }

      .sn-btn-primary {
        height: 32px;
        padding: 0 12px;
        border: none;
        border-radius: 7px;
        background: #c58af9;
        color: #1c1326;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .sn-btn-primary:hover {
        background: #d2a1fb;
      }

      .sn-btn-secondary {
        height: 32px;
        padding: 0 10px;
        border: none;
        border-radius: 7px;
        background: #2e2e2e;
        color: #d4d4d4;
        font-size: 12px;
        cursor: pointer;
      }

      .sn-btn-secondary:hover {
        background: #383838;
      }

      /* Section Header & Search */
      .sn-section-header {
        padding: 0 16px 10px;
        flex-shrink: 0;
      }

      .sn-section-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
      }

      .sn-section-label {
        font-size: 13px;
        color: #d4d4d4;
      }

      .sn-icon-btn {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #cccccc;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .sn-icon-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }

      .sn-icon-btn.sn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }

      .sn-search-wrap {
        margin-top: 6px;
        position: relative;
      }

      .sn-search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #9e9e9e;
        cursor: pointer;
        font-size: 14px;
      }

      /* Notes Feed */
      .sn-feed {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .sn-feed::-webkit-scrollbar,
      .sn-detail-scroll::-webkit-scrollbar {
        width: 6px;
      }

      .sn-feed::-webkit-scrollbar-thumb,
      .sn-detail-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
      }

      .sn-empty-state {
        padding: 48px 16px;
        text-align: center;
        color: #9e9e9e;
      }

      /* Sticky Note Card */
      @keyframes snCardIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .sn-card {
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        transition: filter 0.15s ease, transform 0.15s ease;
        animation: snCardIn 0.2s ease-out forwards;
        flex-shrink: 0;
      }

      .sn-card:hover {
        filter: brightness(1.06);
      }

      .sn-card-accent {
        height: 4px;
        width: 100%;
      }

      .sn-card-body {
        padding: 10px 14px 14px;
      }

      .sn-card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 8px;
        min-height: 20px;
      }

      .sn-card-date {
        color: rgba(255, 255, 255, 0.8);
      }

      .sn-card-actions {
        display: none;
        align-items: center;
        gap: 6px;
        background: rgba(0, 0, 0, 0.32);
        padding: 3px 8px;
        border-radius: 9999px;
      }

      .sn-card:hover .sn-card-actions {
        display: flex;
      }

      .sn-card:hover .sn-card-date {
        display: none;
      }

      .sn-swatch {
        width: 14px;
        height: 14px;
        border-radius: 9999px;
        border: 1px solid rgba(0, 0, 0, 0.35);
        cursor: pointer;
        padding: 0;
        transition: transform 0.12s ease;
      }

      .sn-swatch:hover {
        transform: scale(1.2);
      }

      .sn-swatch.sn-swatch-active {
        box-shadow: 0 0 0 2px #ffffff;
      }

      .sn-card-delete {
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
      }

      .sn-card-delete:hover {
        color: #fca5a5;
      }

      .sn-banner-wrap {
        position: relative;
        margin-bottom: 12px;
        border-radius: 7px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.2);
      }

      .sn-banner-svg,
      .sn-banner-img {
        width: 100%;
        height: 124px;
        object-fit: cover;
        display: block;
      }

      .sn-keycaps {
        position: absolute;
        bottom: 8px;
        right: 10px;
        display: flex;
        gap: 6px;
      }

      .sn-keycap {
        background: rgba(255, 255, 255, 0.9);
        color: #2d2638;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 10.5px;
        font-weight: 600;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
      }

      .sn-card-title {
        margin: 0 0 4px;
        font-size: 14.5px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.3;
      }

      .sn-card-excerpt {
        margin: 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.86);
        line-height: 1.42;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Career Engine Jobs Status Badges on Card */
      .sn-job-row {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .sn-job-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 9px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid rgba(138, 180, 248, 0.45);
        background: rgba(138, 180, 248, 0.16);
        color: #dbeafe;
      }

      .sn-job-badge.sn-tailored {
        border-color: rgba(110, 231, 183, 0.45);
        background: rgba(110, 231, 183, 0.18);
        color: #a7f3d0;
      }

      .sn-job-badge.sn-running {
        border-color: rgba(253, 224, 71, 0.45);
        background: rgba(253, 224, 71, 0.18);
        color: #fef08a;
      }

      .sn-job-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: currentColor;
      }

      .sn-both-done {
        font-size: 11px;
        font-weight: 600;
        color: #a7f3d0;
        background: rgba(16, 185, 129, 0.18);
        padding: 2px 8px;
        border-radius: 6px;
      }

      /* Detail / Live Editor View */
      .sn-detail-bar {
        padding: 8px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }

      .sn-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #e0e0e0;
        font-size: 13px;
        cursor: pointer;
      }

      .sn-back-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .sn-detail-swatches {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .sn-detail-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      .sn-detail-surface {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .sn-detail-inner {
        padding: 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .sn-select {
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        color: #ffffff;
        outline: none;
        cursor: pointer;
      }

      .sn-select option {
        background: #262626;
        color: #ffffff;
      }

      .sn-detail-title {
        width: 100%;
        border: none;
        background: transparent;
        font-size: 17px;
        font-weight: 700;
        color: #ffffff;
        outline: none;
        margin-bottom: 8px;
      }

      .sn-detail-title::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      .sn-job-link-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.25);
        color: #bfdbfe;
        font-size: 12px;
        text-decoration: none;
        word-break: break-all;
      }

      .sn-job-link-pill:hover {
        background: rgba(0, 0, 0, 0.38);
        text-decoration: underline;
      }

      .sn-detail-editor {
        flex: 1;
        font-size: 13.5px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.92);
        outline: none;
        white-space: pre-wrap;
        word-break: break-word;
      }

      // =========================================================================
      function createStickyNotesWindow(options = {}) {
        const {
          defaultOpen = true,
          isPopoutChild = false,
          onLog = () => {},
        } = options;

        const STORAGE_KEY = 'career_engine_sticky_notes_v3';
        const CATS_KEY = 'career_engine_sticky_cats_v3';
        const CHANNEL_NAME = 'career_engine_sticky_sync_channel';

        let notes = [];
        let categories = [...DEFAULT_CATEGORIES];
        let activeCategory = 'All';
        let searchQuery = '';
        let activeNoteId = null;
        let selectedComposerTheme = 'purple';
        let uploadedImageDataUrl = null;
        let isOpen = Boolean(defaultOpen);
        let isMinimized = false;
        let isDetached = false;
        let popoutRef = null;
        let popoutPollTimer = null;
        let toastTimer = null;
        let saveTimer = null;

        const channel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(CHANNEL_NAME) : null;

        function loadFromStorage() {
          try {
            const rawCats = localStorage.getItem(CATS_KEY);
            if (rawCats) {
              const parsedCats = JSON.parse(rawCats);
              if (Array.isArray(parsedCats) && parsedCats.length > 0) {
                categories = parsedCats;
              }
            }
            const rawNotes = localStorage.getItem(STORAGE_KEY);
            if (rawNotes) {
              const parsedNotes = JSON.parse(rawNotes);
              if (Array.isArray(parsedNotes) && parsedNotes.length > 0) {
                notes = parsedNotes;
                return;
              }
            }
          } catch (err) {
            console.warn('localStorage load failed:', err);
          }
          categories = [...DEFAULT_CATEGORIES];
          notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
          saveToStorage(false);
        }

        function saveToStorage(broadcast = true) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            localStorage.setItem(CATS_KEY, JSON.stringify(categories));
          } catch (err) {
            console.warn('localStorage save failed:', err);
          }
          if (broadcast && channel) {
            channel.postMessage({ type: 'SYNC_NOTES', notes, categories });
          }
        }

        loadFromStorage();

        if (channel) {
          channel.onmessage = (event) => {
            const msg = event.data;
            if (!msg) return;
            if (msg.type === 'SYNC_NOTES') {
              notes = msg.notes || notes;
              categories = msg.categories || categories;
              renderCategoryTabs();
              renderNotes();
              if (activeNoteId) {
                const updated = notes.find((n) => n.id === activeNoteId);
                if (updated) syncDetailFieldsFromNote(updated);
              }
            } else if (msg.type === 'POPOUT_CLOSED' && !isPopoutChild) {
              dockBackFromPopout('Separate window closed — docked back into main app.');
            }
          };
        }

        window.addEventListener('storage', (e) => {
          if (e.key === STORAGE_KEY || e.key === CATS_KEY) {
            loadFromStorage();
            renderCategoryTabs();
            renderNotes();
          }
        });

        function detachToSeparateWindow(screenX, screenY, singleNoteId = null) {
          if (isPopoutChild) return;

          const width = singleNoteId ? 310 : 396;
          const left = Math.max(16, Math.min(window.innerWidth - width - 16, Math.round((screenX ?? window.innerWidth / 2) - width / 2)));
          const top = Math.max(16, Math.min(window.innerHeight - 140, Math.round((screenY ?? 80) - 20)));

          if (singleNoteId) {
            spawnInPageTornNote(singleNoteId, left, top);
            onLog('Peeled out sticky note into an in-page floating panel.');
          } else {
            rootEl.style.right = 'auto';
            rootEl.style.left = `${left}px`;
            rootEl.style.top = `${top}px`;
            showToast('Detached Sticky Notes into workspace');
            onLog('Detached Sticky Notes panel inside workspace.');
          }
        }

        // IN-PAGE TORN-OUT SINGLE STICKY NOTE (Minimalist Dark Panel + Top Strip)
        // =====================================================================
        function spawnInPageTornNote(noteId, rawX, rawY) {
          const existing = document.querySelector(`.sn-torn-note[data-torn-id="${noteId}"]`);
          if (existing) existing.remove();

          const note = notes.find((n) => n.id === noteId);
          if (!note) return;

          const theme = NOTE_THEMES[note.theme] || NOTE_THEMES.green;
          const tornEl = document.createElement('div');
          tornEl.className = 'sn-torn-note';
          tornEl.dataset.tornId = noteId;

          const safeLeft = Math.max(16, Math.min(window.innerWidth - 326, Number.isFinite(rawX) ? rawX : 48));
          const safeTop = Math.max(16, Math.min(window.innerHeight - 300, Number.isFinite(rawY) ? rawY : 64));
          tornEl.style.left = `${safeLeft}px`;
          tornEl.style.top = `${safeTop}px`;

          const swatchHTML = Object.values(NOTE_THEMES)
            .map(
              (t) =>
                `<button type="button" data-torn-theme="${t.id}" title="${t.name}" style="background:${t.accent}; width:11px; height:11px;" class="sn-swatch ${
                  note.theme === t.id ? 'sn-swatch-active' : ''
                }"></button>`
            )
            .join('');

          const initialContent =
            note.body && stripHtml(note.body).trim().length > 0
              ? note.body
              : escapeHtml(note.title || '');

          tornEl.innerHTML = `
            <div class="sn-torn-top-strip" data-torn-drag style="background:${theme.accent};">
              <div class="sn-torn-hover-controls">
                ${swatchHTML}
                <button type="button" data-torn-dock title="Dock back into list"
                  style="margin-left:3px; border:none; background:transparent; color:#fff; cursor:pointer; font-size:13px; line-height:1; padding:0 2px;">×</button>
              </div>
            </div>
            <div class="sn-torn-body">
              <div class="sn-torn-editor" data-torn-body contenteditable="true" data-placeholder="Take a note...">${initialContent}</div>
            </div>
          `;

          document.body.appendChild(tornEl);

          // Drag torn note freely via top accent strip
          const header = tornEl.querySelector('[data-torn-drag]');
          let dragging = false;
          let offX = 0;
          let offY = 0;

          header.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            dragging = true;
            const r = tornEl.getBoundingClientRect();
            offX = e.clientX - r.left;
            offY = e.clientY - r.top;
            header.setPointerCapture(e.pointerId);
          });

          header.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const nx = Math.max(8, Math.min(window.innerWidth - tornEl.offsetWidth - 8, e.clientX - offX));
            const ny = Math.max(8, Math.min(window.innerHeight - tornEl.offsetHeight - 8, e.clientY - offY));
            tornEl.style.left = `${nx}px`;
            tornEl.style.top = `${ny}px`;
          });

          header.addEventListener('pointerup', (e) => {
            if (!dragging) return;
            dragging = false;
            header.releasePointerCapture(e.pointerId);
          });

          // Live two-way sync between torn note & main Sticky Notes list
          const bodyInput = tornEl.querySelector('[data-torn-body]');

          const syncBack = () => {
            const target = notes.find((n) => n.id === noteId);
            if (!target) return;
            target.body = bodyInput.innerHTML;
            saveToStorage(true);
            renderNotes();
            if (activeNoteId === noteId) syncDetailFieldsFromNote(target);
          };

          bodyInput.addEventListener('input', syncBack);

          tornEl.addEventListener('click', (e) => {
            const themeBtn = e.target.closest('[data-torn-theme]');
            if (themeBtn) {
              const target = notes.find((n) => n.id === noteId);
              if (target) {
                target.theme = themeBtn.dataset.tornTheme;
                const nt = NOTE_THEMES[target.theme] || NOTE_THEMES.green;
                tornEl.querySelector('[data-torn-drag]').style.backgroundColor = nt.accent;
                tornEl.querySelectorAll('[data-torn-theme]').forEach((btn) => {
                  btn.classList.toggle('sn-swatch-active', btn.dataset.tornTheme === target.theme);
                });
                saveToStorage(true);
                renderNotes();
              }
              return;
            }
            if (e.target.closest('[data-torn-dock]')) {
              tornEl.remove();
              showToast('Docked note back into Sticky Notes');
            }
          });

        let cardDragState = null;

          const cardEl = e.target.closest('[data-open-note]');

          cardDragState = {
            noteId: cardEl.dataset.openNote,
            cardEl,
            startX: e.clientX,
            startY: e.clientY,
            active: false,
            ghostEl: null,
          };
        });

          if (!cardDragState) return;
          const dist = Math.hypot(e.clientX - cardDragState.startX, e.clientY - cardDragState.startY);

          if (!cardDragState.active && dist > 10) {

        function syncVisibility() {

        // =====================================================================
        // STEP 1: MINIMIZED PILL DRAG-TO-EXPAND INTERACTION

        if (!isPopoutChild) {
          let pillDragging = false;
          let pillMoved = false;
          let pillStartX = 0;
          let pillStartY = 0;
          let pillOrigRight = 24;
          let pillOrigBottom = 24;

          pillEl.addEventListener('pointerdown', (e) => {
            pillDragging = true;
            pillMoved = false;
            pillStartX = e.clientX;
            pillStartY = e.clientY;
            const rect = pillEl.getBoundingClientRect();
            pillOrigRight = window.innerWidth - rect.right;
            pillOrigBottom = window.innerHeight - rect.bottom;
            pillEl.setPointerCapture(e.pointerId);
          });

          pillEl.addEventListener('pointermove', (e) => {
            if (!pillDragging) return;
            const dx = e.clientX - pillStartX;
            const dy = e.clientY - pillStartY;
            if (Math.hypot(dx, dy) > 6) pillMoved = true;

            const newRight = Math.max(12, Math.min(window.innerWidth - 160, pillOrigRight - dx));
            const newBottom = Math.max(12, Math.min(window.innerHeight - 52, pillOrigBottom - dy));
            pillEl.style.right = `${newRight}px`;
            pillEl.style.bottom = `${newBottom}px`;

            // Pulling the pill inward past 90px from the corner expands the full window
            if (Math.hypot(dx, dy) > 90) {
              pillDragging = false;
              pillEl.releasePointerCapture(e.pointerId);
              // Position the expanded window where the user pulled the pill
              const targetLeft = Math.max(12, Math.min(window.innerWidth - 410, e.clientX - 180));
              const targetTop = Math.max(12, Math.min(window.innerHeight - 540, e.clientY - 24));

            if (!pillDragging) return;
            pillDragging = false;
            pillEl.releasePointerCapture(e.pointerId);

          rootEl.style.left = '';
          rootEl.style.top = '24px';
          rootEl.style.right = '24px';
          loadFromStorage();
          renderCategoryTabs();
          renderNotes();
          syncVisibility();
          if (reason) onLog(reason);
        }

        if (!isPopoutChild) {
          const titlebarEl = q('[data-el="titlebar"]');
          const edgeGuideEl = document.getElementById('snEdgeGuide');
          let winDragging = false;
          let dragOffsetX = 0;
          let dragOffsetY = 0;
          let atViewportEdge = false;

          titlebarEl.addEventListener('pointerdown', (e) => {
            // Ignore clicks on titlebar buttons
            if (e.target.closest('button') || e.target.closest('.sn-menu-dropdown')) return;
            winDragging = true;
            atViewportEdge = false;
            const rect = rootEl.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            rootEl.classList.add('sn-dragging');
            titlebarEl.setPointerCapture(e.pointerId);
          });

          titlebarEl.addEventListener('pointermove', (e) => {
            if (!winDragging) return;
            const newLeft = e.clientX - dragOffsetX;
            const newTop = e.clientY - dragOffsetY;

            // Clamp visual preview slightly at edges while highlighting tear-out zone
            const clampedLeft = Math.max(-40, Math.min(window.innerWidth - rootEl.offsetWidth + 40, newLeft));
            const clampedTop = Math.max(-10, Math.min(window.innerHeight - 60, newTop));

            rootEl.style.right = 'auto';
            rootEl.style.left = `${clampedLeft}px`;
            rootEl.style.top = `${clampedTop}px`;

            // Detect reaching any edge of the main app window
            const edgeThreshold = 18;
            atViewportEdge =
              e.clientX <= edgeThreshold ||
              e.clientX >= window.innerWidth - edgeThreshold ||
              e.clientY <= edgeThreshold ||
              e.clientY >= window.innerHeight - edgeThreshold;

            if (edgeGuideEl) {
              edgeGuideEl.classList.toggle('sn-active', atViewportEdge);
            }
          });

          titlebarEl.addEventListener('pointerup', (e) => {
            if (!winDragging) return;
            winDragging = false;
            rootEl.classList.remove('sn-dragging');
            titlebarEl.releasePointerCapture(e.pointerId);
            if (edgeGuideEl) edgeGuideEl.classList.remove('sn-active');

            if (atViewportEdge) {
              detachToSeparateWindow(e.screenX, e.screenY);
            }
          });
        } else {
          // Notify parent window when pop-out closes
          window.addEventListener('beforeunload', () => {
            if (channel) {
              channel.postMessage({ type: 'POPOUT_CLOSED' });
            }
          });
        }

        // =====================================================================
        // 3. RENDERING CATEGORY TABS & NOTES LIST
        // =====================================================================
        function renderCategoryTabs() {
          const bar = q('[data-el="category-tabs"]');
          const allTabs = ['All', ...categories];

          bar.innerHTML =
            allTabs
              .map((cat) => {
                const active = activeCategory === cat;
                const count =
                  cat === 'All'
                    ? notes.length
                    : notes.filter((n) => (n.category || '').toLowerCase() === cat.toLowerCase()).length;
                return `
                  <button type="button" data-cat="${escapeHtml(cat)}" class="sn-cat-tab ${active ? 'sn-active' : ''}">
                    <span>${escapeHtml(cat)}</span>
                    <span class="sn-cat-count">${count}</span>
                  </button>
                `;
              })
              .join('') +
            `<button type="button" data-action="show-add-cat" class="sn-add-cat-btn" title="Add category">+</button>`;

          q('[data-el="section-label"]').textContent =
            activeCategory === 'All' ? 'Recent notes' : `${activeCategory} notes`;
        }

        function renderJobStatusFooter(note) {
          if ((note.category || '').toLowerCase() !== 'jobs') return '';
          const status = note.jobStatus || 'ready_for_tailoring';
          const isTailored = status === 'tailored';
          const isRunning = status === 'tailoring...';
          const badgeClass = isTailored ? 'sn-tailored' : isRunning ? 'sn-running' : '';

          return `
            <div class="sn-job-row">
              <span class="sn-job-badge ${badgeClass}">
                <span class="sn-job-dot"></span>
                <span>${escapeHtml(status)}</span>
              </span>
              ${note.bothDone ? `<span class="sn-both-done">Both - done</span>` : ''}
            </div>
          `;
        }

        function renderNotes() {
          const feed = q('[data-el="notes-feed"]');
          const query = searchQuery.trim().toLowerCase();

          const filtered = notes.filter((note) => {
            const matchesCat =
              activeCategory === 'All' ||
              (note.category || '').toLowerCase() === activeCategory.toLowerCase();
            if (!matchesCat) return false;
            if (!query) return true;
            return (
              note.title.toLowerCase().includes(query) ||
              (note.category || '').toLowerCase().includes(query) ||
              stripHtml(note.body).toLowerCase().includes(query) ||
              (note.jobDescription || '').toLowerCase().includes(query)
            );
          });

          if (filtered.length === 0) {
            feed.innerHTML = `
              <div class="sn-empty-state">
                <p style="margin:0 0 4px; font-size:13.5px;">No notes in ${escapeHtml(activeCategory)}</p>
                <p style="margin:0; font-size:12px; color:#757575;">Click "+ Note" above to add one.</p>
              </div>
            `;
            return;
          }

          feed.innerHTML = filtered
            .map((note) => {
              const theme = NOTE_THEMES[note.theme] || NOTE_THEMES.purple;
              const hasBanner = note.customImage || (note.bannerType && note.bannerType !== 'none');
              let bannerHTML = '';

              if (note.customImage) {
                bannerHTML = `
                  <div class="sn-banner-wrap">
                    <img src="${note.customImage}" alt="${escapeHtml(note.title)}" class="sn-banner-img" />
                  </div>`;
              } else if (hasBanner) {
                bannerHTML = `<div class="sn-banner-wrap">${getIllustrationSVG(note.bannerType)}</div>`;
              }

              const swatches = Object.values(NOTE_THEMES)
                .map(
                  (t) => `
                  <button type="button" data-quick-theme="${t.id}" data-note-id="${note.id}" title="${t.name}"
                    style="background-color: ${t.accent};"
                    class="sn-swatch ${note.theme === t.id ? 'sn-swatch-active' : ''}">
                  </button>`
                )
                .join('');

              return `
                <article data-open-note="${note.id}" style="background-color: ${theme.bg};" class="sn-card">
                  <div style="background-color: ${theme.accent};" class="sn-card-accent"></div>
                  <div class="sn-card-body">
                    <div class="sn-card-meta">
                      <span>${escapeHtml(note.category || 'Note')}</span>
                      <div>
                        <div class="sn-card-actions">
                          ${swatches}
                          <button type="button" data-delete-note="${note.id}" class="sn-card-delete" title="Delete note">×</button>
                        </div>
                        <span class="sn-card-date">${escapeHtml(note.date)}</span>
                      </div>
                    </div>

                    ${bannerHTML}

                    <h2 class="sn-card-title">${escapeHtml(note.title || 'Untitled note')}</h2>
                    <p class="sn-card-excerpt">${escapeHtml(stripHtml(note.body))}</p>
                    ${renderJobStatusFooter(note)}
                  </div>
                </article>
              `;
            })
            .join('');
        }

        // =====================================================================
        // 4. NOTE DETAIL VIEW & CAREER ENGINE TASK ACTION
        // =====================================================================
        function syncDetailFieldsFromNote(note) {
          const theme = NOTE_THEMES[note.theme] || NOTE_THEMES.purple;
          q('[data-el="detail-surface"]').style.backgroundColor = theme.bg;
          q('[data-el="detail-accent"]').style.backgroundColor = theme.accent;

          const catSelect = q('[data-el="detail-category"]');
          const allCats = [...new Set([...categories, note.category || 'Tips'])];
          catSelect.innerHTML = allCats
            .map(
              (c) =>
                `<option value="${escapeHtml(c)}" ${c === note.category ? 'selected' : ''}>${escapeHtml(c)}</option>`
            )
            .join('');

          q('[data-el="detail-date"]').textContent = note.date || '';
          if (document.activeElement !== q('[data-el="detail-title"]')) {
            q('[data-el="detail-title"]').value = note.title || '';
          }
          if (document.activeElement !== q('[data-el="detail-body"]')) {
            q('[data-el="detail-body"]').innerHTML = note.body || '';
          }

          const linkEl = q('[data-el="detail-job-link"]');
          if ((note.category || '').toLowerCase() === 'jobs' && note.jobLink) {
            linkEl.href = note.jobLink;
            linkEl.textContent = `🔗 ${note.jobLink}`;
            linkEl.classList.remove('sn-hidden');
          } else {
            linkEl.classList.add('sn-hidden');
          }

          const jobsPanel = q('[data-el="jobs-detail-panel"]');
          if ((note.category || '').toLowerCase() === 'jobs') {
            jobsPanel.classList.remove('sn-hidden');
            const statusText = note.bothDone
              ? `${note.jobStatus || 'tailored'} • Both - done`
              : note.jobStatus || 'ready_for_tailoring';
            q('[data-el="jobs-detail-status"]').textContent = statusText;
          } else {
            jobsPanel.classList.add('sn-hidden');
          }
        }

        function openDetailView(id) {
          const note = notes.find((n) => n.id === id);
          if (!note) return;

          activeNoteId = id;
          q('[data-el="list-view"]').classList.add('sn-hidden');
          q('[data-el="detail-view"]').classList.remove('sn-hidden');

          q('[data-el="detail-swatches"]').innerHTML = Object.values(NOTE_THEMES)
            .map(
              (t) => `
              <button type="button" data-detail-theme="${t.id}" title="${t.name}"
                style="background-color: ${t.accent};"
                class="sn-swatch ${note.theme === t.id ? 'sn-swatch-active' : ''}">
              </button>`
            )
            .join('');

          const bannerEl = q('[data-el="detail-banner"]');
          if (note.customImage) {
            bannerEl.classList.remove('sn-hidden');
            bannerEl.innerHTML = `<img src="${note.customImage}" class="sn-banner-img" style="height:auto; max-height:176px;" />`;
          } else if (note.bannerType && note.bannerType !== 'none') {
            bannerEl.classList.remove('sn-hidden');
            bannerEl.innerHTML = getIllustrationSVG(note.bannerType);
          } else {
            bannerEl.classList.add('sn-hidden');
            bannerEl.innerHTML = '';
          }

          syncDetailFieldsFromNote(note);
        }

        function closeDetailView() {
          activeNoteId = null;
          q('[data-el="detail-view"]').classList.add('sn-hidden');
          q('[data-el="list-view"]').classList.remove('sn-hidden');
          renderCategoryTabs();
          renderNotes();
        }

        function saveDetailEdits() {
          if (!activeNoteId) return;
          const note = notes.find((n) => n.id === activeNoteId);
          if (!note) return;

          note.category = q('[data-el="detail-category"]').value || 'Tips';
          note.title = q('[data-el="detail-title"]').value;
          note.body = q('[data-el="detail-body"]').innerHTML;

          if ((note.category || '').toLowerCase() === 'jobs' && !note.jobStatus) {
            note.jobStatus = 'ready_for_tailoring';
          }

          syncDetailFieldsFromNote(note);

          const status = q('[data-el="save-status"]');
          status.textContent = 'Saving...';
          saveToStorage(true);
          renderCategoryTabs();

          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            status.textContent = 'Saved';
          }, 350);
        }

        // =====================================================================
        // 5. CREATE POP-UP (With Dynamic Jobs Link & Description Fields)
        // =====================================================================
        function syncComposerJobsVisibility() {
          const cat = q('[data-el="composer-category"]').value;
          const jobsExtra = q('[data-el="composer-jobs-fields"]');
          if ((cat || '').toLowerCase() === 'jobs') {
            jobsExtra.classList.remove('sn-hidden');
          } else {
            jobsExtra.classList.add('sn-hidden');
          }
        }

        function openComposerModal() {
          q('[data-el="menu-dropdown"]').classList.add('sn-hidden');
          selectedComposerTheme = activeCategory === 'Jobs' ? 'blue' : 'purple';
          uploadedImageDataUrl = null;

          const catSelect = q('[data-el="composer-category"]');
          const defaultCat = activeCategory === 'All' ? 'Ideas' : activeCategory;
          catSelect.innerHTML = categories
            .map(
              (c) => `<option value="${escapeHtml(c)}" ${c === defaultCat ? 'selected' : ''}>${escapeHtml(c)}</option>`
            )
            .join('');

          q('[data-el="composer-banner"]').value = 'none';
          q('[data-el="composer-title"]').value = '';
          q('[data-el="composer-job-link"]').value = '';
          q('[data-el="composer-job-desc"]').value = '';
          q('[data-el="composer-body"]').value = '';
          q('[data-el="upload-label"]').textContent = 'Attach an image...';
          q('[data-el="clear-upload"]').classList.add('sn-hidden');
          q('[data-el="composer-accent"]').style.backgroundColor = NOTE_THEMES[selectedComposerTheme].accent;

          syncComposerJobsVisibility();
          renderComposerSwatches();
          q('[data-el="composer-modal"]').classList.remove('sn-hidden');
          setTimeout(() => q('[data-el="composer-title"]').focus(), 40);
        }

        function renderComposerSwatches() {
          q('[data-el="composer-swatches"]').innerHTML = Object.values(NOTE_THEMES)
            .map(
              (t) => `
              <button type="button" data-comp-theme="${t.id}"
                style="background-color: ${t.accent}; width:22px; height:22px;"
                class="sn-swatch ${selectedComposerTheme === t.id ? 'sn-swatch-active' : ''}">
              </button>`
            )
            .join('');
        }

        function triggerScreenshotCapture() {
          q('[data-el="menu-dropdown"]').classList.add('sn-hidden');
          const flash = q('[data-el="flash-overlay"]');
          flash.classList.remove('sn-hidden');
          flash.style.opacity = '0.85';
          setTimeout(() => {
            flash.style.opacity = '0';
            setTimeout(() => flash.classList.add('sn-hidden'), 240);
          }, 80);

          const now = new Date();
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const targetCategory = activeCategory === 'All' ? 'Tips' : activeCategory;

          const newSnip = {
            id: 'note-' + Date.now(),
            theme: 'blue',
            category: targetCategory,
            date: getFormattedToday(),
            bannerType: 'banner-snapshot',
            customImage: null,
            title: `Screen capture (${timeStr})`,
            body: 'Captured via Sticky Notes 1-click snip. Click to annotate or edit.',
          };

          if (targetCategory.toLowerCase() === 'jobs') {
            newSnip.jobStatus = 'ready_for_tailoring';
            newSnip.bothDone = false;
          }

          notes.unshift(newSnip);
          saveToStorage(true);

          if (activeNoteId) {
            closeDetailView();
          } else {
            renderCategoryTabs();
            renderNotes();
          }
          showToast(`Screenshot saved to ${targetCategory}`);
        }

        // =====================================================================
        // 6. EVENT LISTENERS
        // =====================================================================
        const handleRootClick = (e) => {
          const actionBtn = e.target.closest('[data-action]');
          if (actionBtn) {
            const action = actionBtn.dataset.action;

            if (action === 'toggle-menu') {
              e.stopPropagation();
              q('[data-el="menu-dropdown"]').classList.toggle('sn-hidden');
            } else if (action === 'open-composer') {
              openComposerModal();
            } else if (action === 'close-composer') {
              q('[data-el="composer-modal"]').classList.add('sn-hidden');
            } else if (action === 'create-note') {
              const title = q('[data-el="composer-title"]').value.trim() || 'Quick Note';
              const category = q('[data-el="composer-category"]').value || 'Ideas';
              const bodyText = q('[data-el="composer-body"]').value.trim();
              const jobLink = q('[data-el="composer-job-link"]').value.trim();
              const jobDesc = q('[data-el="composer-job-desc"]').value.trim();
              const bannerType = q('[data-el="composer-banner"]').value;

              const isJob = category.toLowerCase() === 'jobs';
              const combinedBody = bodyText || jobDesc || 'Tap to edit this sticky note...';

              const created = {
                id: 'note-' + Date.now(),
                theme: selectedComposerTheme,
                category,
                date: getFormattedToday(),
                bannerType: uploadedImageDataUrl ? 'none' : bannerType,
                customImage: uploadedImageDataUrl,
                title,
                body: escapeHtml(combinedBody).replace(/\n/g, '<br>'),
                ...(isJob
                  ? {
                      jobLink,
                      jobDescription: jobDesc,
                      jobStatus: 'ready_for_tailoring',
                      bothDone: false,
                    }
                  : {}),
              };

              notes.unshift(created);
              saveToStorage(true);
              q('[data-el="composer-modal"]').classList.add('sn-hidden');
              renderCategoryTabs();
              renderNotes();
              showToast(`Added to ${category}`);
            } else if (action === 'capture-screenshot') {
              triggerScreenshotCapture();
            } else if (action === 'reset-demo') {
              q('[data-el="menu-dropdown"]').classList.add('sn-hidden');
              categories = [...DEFAULT_CATEGORIES];
              activeCategory = 'All';
              notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
              saveToStorage(true);
              if (activeNoteId) closeDetailView();
              else {
                renderCategoryTabs();
                renderNotes();
              }
              showToast('Reset demo notes');
            } else if (action === 'minimize') {
              api.minimize();
            } else if (action === 'close') {
              if (isPopoutChild) {
                window.close();
              } else {
                api.close();
              }
            } else if (action === 'show-add-cat') {
              q('[data-el="new-category-bar"]').classList.remove('sn-hidden');
              q('[data-el="new-category-input"]').focus();
            } else if (action === 'cancel-category') {
              q('[data-el="new-category-bar"]').classList.add('sn-hidden');
              q('[data-el="new-category-input"]').value = '';
            } else if (action === 'confirm-category') {
              const raw = q('[data-el="new-category-input"]').value.trim();
              if (raw) {
                const formatted = raw.charAt(0).toUpperCase() + raw.slice(1);
                if (!categories.some((c) => c.toLowerCase() === formatted.toLowerCase())) {
                  categories.push(formatted);
                  saveToStorage(true);
                }
                activeCategory = formatted;
              }
              q('[data-el="new-category-bar"]').classList.add('sn-hidden');
              q('[data-el="new-category-input"]').value = '';
              renderCategoryTabs();
              renderNotes();
            } else if (action === 'toggle-search') {
              const bar = q('[data-el="search-bar"]');
              if (bar.classList.contains('sn-hidden')) {
                bar.classList.remove('sn-hidden');
                q('[data-el="search-input"]').focus();
              } else {
                searchQuery = '';
                q('[data-el="search-input"]').value = '';
                bar.classList.add('sn-hidden');
                renderNotes();
              }
            } else if (action === 'clear-search') {
              searchQuery = '';
              q('[data-el="search-input"]').value = '';
              renderNotes();
            } else if (action === 'close-detail') {
              closeDetailView();
            } else if (action === 'copy-active') {
              const note = notes.find((n) => n.id === activeNoteId);
              if (note) {
                const ta = document.createElement('textarea');
                ta.value = `${note.title}\n${stripHtml(note.body)}`;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Copied note to clipboard');
              }
            } else if (action === 'delete-active') {
              notes = notes.filter((n) => n.id !== activeNoteId);
              saveToStorage(true);
              closeDetailView();
              showToast('Sticky note deleted');
            } else if (action === 'run-job-task') {
              const note = notes.find((n) => n.id === activeNoteId);
              if (note) {
                note.jobStatus = 'tailoring...';
                note.bothDone = false;
                saveToStorage(true);
                syncDetailFieldsFromNote(note);
                renderNotes();
                showToast('Running Career Engine tailoring...');
                onLog(`Career Engine started tailoring task for "${note.title}"...`);

                setTimeout(() => {
                  const target = notes.find((n) => n.id === note.id);
                  if (target) {
                    target.jobStatus = 'tailored';
                    target.bothDone = true;
                    saveToStorage(true);
                    if (activeNoteId === target.id) {
                      syncDetailFieldsFromNote(target);
                    }
                    renderNotes();
                    showToast('Task finished — Both - done');
                    onLog(`Career Engine finished "${target.title}" (tailored • Both - done).`);
                  }
                }, 1100);
              }
            }
            return;
          }

          const catBtn = e.target.closest('[data-cat]');
          if (catBtn) {
            activeCategory = catBtn.dataset.cat;
            renderCategoryTabs();
            renderNotes();
            return;
          }

          const quickTheme = e.target.closest('[data-quick-theme]');
          if (quickTheme) {
            e.stopPropagation();
            const note = notes.find((item) => item.id === quickTheme.dataset.noteId);
            if (note) {
              note.theme = quickTheme.dataset.quickTheme;
              saveToStorage(true);
              renderNotes();
            }
            return;
          }

          const delBtn = e.target.closest('[data-delete-note]');
          if (delBtn) {
            e.stopPropagation();
            notes = notes.filter((item) => item.id !== delBtn.dataset.deleteNote);
            saveToStorage(true);
            renderCategoryTabs();
            renderNotes();
            showToast('Note removed');
            return;
          }

          const detailTheme = e.target.closest('[data-detail-theme]');
          if (detailTheme && activeNoteId) {
            const note = notes.find((item) => item.id === activeNoteId);
            if (note) {
              note.theme = detailTheme.dataset.detailTheme;
              saveToStorage(true);
              openDetailView(activeNoteId);
            }
            return;
          }

          const compTheme = e.target.closest('[data-comp-theme]');
          if (compTheme) {
            selectedComposerTheme = compTheme.dataset.compTheme;
            q('[data-el="composer-accent"]').style.backgroundColor = NOTE_THEMES[selectedComposerTheme].accent;
            renderComposerSwatches();
            return;
          }

          const fmtBtn = e.target.closest('[data-cmd]');
          if (fmtBtn) {
            q('[data-el="detail-body"]').focus();
            document.execCommand(fmtBtn.dataset.cmd, false, null);
            saveDetailEdits();
            return;
          }

          const cardEl = e.target.closest('[data-open-note]');
          if (cardEl && !suppressCardClick) {
            openDetailView(cardEl.dataset.openNote);
          }
        };

        rootEl.addEventListener('click', handleRootClick);

        q('[data-el="search-input"]').addEventListener('input', (e) => {
          searchQuery = e.target.value;
          renderNotes();
        });

        q('[data-el="new-category-input"]').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') q('[data-action="confirm-category"]').click();
          if (e.key === 'Escape') q('[data-action="cancel-category"]').click();
        });

        q('[data-el="composer-category"]').addEventListener('change', syncComposerJobsVisibility);
        q('[data-el="detail-category"]').addEventListener('change', saveDetailEdits);
        q('[data-el="detail-title"]').addEventListener('input', saveDetailEdits);
        q('[data-el="detail-body"]').addEventListener('input', saveDetailEdits);

        q('[data-el="upload-input"]').addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            uploadedImageDataUrl = ev.target.result;
            q('[data-el="upload-label"]').textContent = file.name.slice(0, 22);
            q('[data-el="clear-upload"]').classList.remove('sn-hidden');
          };
          reader.readAsDataURL(file);
        });

        q('[data-el="clear-upload"]').addEventListener('click', () => {
          uploadedImageDataUrl = null;
          q('[data-el="upload-input"]').value = '';
          q('[data-el="upload-label"]').textContent = 'Attach an image...';
          q('[data-el="clear-upload"]').classList.add('sn-hidden');
        });

        document.addEventListener('keydown', (e) => {
          if (e.altKey && e.key.toLowerCase() === 's') {
            e.preventDefault();
            api.open();
          } else if (e.key === 'Escape' && isOpen && !isMinimized) {
            if (!q('[data-el="composer-modal"]').classList.contains('sn-hidden')) {
              q('[data-el="composer-modal"]').classList.add('sn-hidden');
            } else if (!isPopoutChild) {
              api.close();
            }
          }
        });

        document.addEventListener('click', (e) => {
          if (!rootEl.contains(e.target)) {
            q('[data-el="menu-dropdown"]').classList.add('sn-hidden');
          }
        });

        const api = {
          open() {
            if (isDetached && popoutRef && !popoutRef.closed) {
              popoutRef.focus();
              return;
            }
            isOpen = true;
            isMinimized = false;
            syncVisibility();
          },
          close() {
            isOpen = false;
            isMinimized = false;
            syncVisibility();
          },
          minimize() {
            if (isDetached) return;
            isOpen = true;
            isMinimized = true;
            syncVisibility();
          },
          restore() {
            isOpen = true;
            isMinimized = false;
            syncVisibility();
          },
          popout() {
            detachToSeparateWindow();
          },
        };

        renderCategoryTabs();
        renderNotes();
        syncVisibility();

        return api;
      }

      // =========================================================================
      // 3. BOOTSTRAP MAIN APP OR POP-OUT CHILD WINDOW
      // =========================================================================
      const params = new URLSearchParams(window.location.search);
      const isPopoutChild = params.get('popout') === '1';
      const popoutSingleNoteId = params.get('noteId');
      const statusEl = document.getElementById('host-status');

      function logStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      if (isPopoutChild) {
        document.body.classList.add('sn-popout-mode');
        const hostEl = document.getElementById('slateHost');
        if (hostEl) hostEl.remove();

        if (popoutSingleNoteId) {
          document.title = 'Sticky Note';
          const winApi = createStickyNotesWindow({ defaultOpen: false, isPopoutChild: true });
          // Render single standalone note filling the pop-out window
          const rawNotes = JSON.parse(localStorage.getItem('career_engine_sticky_notes_v3') || '[]');
          const targetNote = rawNotes.find((n) => n.id === popoutSingleNoteId);
          if (targetNote) {
            const theme = NOTE_THEMES[targetNote.theme] || NOTE_THEMES.green;
            const singleEl = document.createElement('div');
            singleEl.className = 'sn-torn-note sn-torn-popout-full';
            const initialContent =
              targetNote.body && stripHtml(targetNote.body).trim().length > 0
                ? targetNote.body
                : escapeHtml(targetNote.title || '');
            singleEl.innerHTML = `
              <div class="sn-torn-top-strip" style="background:${theme.accent};">
                <div class="sn-torn-hover-controls">
                  <button type="button" onclick="window.close()" title="Dock back" style="border:none; background:transparent; color:#fff; cursor:pointer; font-size:13px; line-height:1; padding:0 4px;">×</button>
                </div>
              </div>
              <div class="sn-torn-body">
                <div id="popSingleBody" class="sn-torn-editor" contenteditable="true" data-placeholder="Take a note...">${initialContent}</div>
              </div>
            `;
            document.body.appendChild(singleEl);

            const ch = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('career_engine_sticky_sync_channel') : null;
            const syncSingle = () => {
              const list = JSON.parse(localStorage.getItem('career_engine_sticky_notes_v3') || '[]');
              const item = list.find((n) => n.id === popoutSingleNoteId);
              if (item) {
                item.body = document.getElementById('popSingleBody').innerHTML;
                localStorage.setItem('career_engine_sticky_notes_v3', JSON.stringify(list));
                const cats = JSON.parse(localStorage.getItem('career_engine_sticky_cats_v3') || '[]');
                if (ch) ch.postMessage({ type: 'SYNC_NOTES', notes: list, categories: cats });
              }
            };
            document.getElementById('popSingleBody').addEventListener('input', syncSingle);
          }
        } else {
          document.title = 'Sticky Notes (Pop-Out Window)';
          createStickyNotesWindow({ defaultOpen: true, isPopoutChild: true });
        }
      } else {
        const stickyWin = createStickyNotesWindow({
          defaultOpen: true,
          isPopoutChild: false,
          onLog: logStatus,
        });
      }
    </script>
  </body>
</html>
