<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes Standalone Demo — Slate</title>
    <link rel="stylesheet" href="./sticky-notes.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e1b2e 0%, #111318 55%, #0b0d11 100%);
        color: #e5e7eb;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .slate-host {
        max-width: 520px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 24px;
      }

      .slate-host h1 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #ffffff;
      }

      .slate-host p {
        margin: 0 0 18px;
        font-size: 13.5px;
        line-height: 1.5;
        color: #9ca3af;
      }

      .slate-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .slate-btn {
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .slate-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .slate-btn-primary {
        background: #c58af9;
        color: #1c1326;
        border-color: #c58af9;
        font-weight: 600;
      }

      .slate-btn-primary:hover {
        background: #d2a1fb;
      }

      .slate-log {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #d8b4fe;
        min-height: 36px;
      }
    </style>
  </head>
  <body>
    <section class="slate-host">
      <h1>Slate Host App — Sticky Notes Testbed</h1>
      <p>
        This standalone page runs the vanilla ES module Sticky Notes window using built-in
        <code>localStorage</code> persistence and simulated Slate task callbacks. Press
        <strong>Alt + S</strong> anytime to open, or <strong>Escape</strong> to close.
      </p>

      <div class="slate-controls">
        <button id="btn-open" type="button" class="slate-btn slate-btn-primary">
          Open Sticky Notes (Alt+S)
        </button>
        <button id="btn-min" type="button" class="slate-btn">Minimize</button>
        <button id="btn-restore" type="button" class="slate-btn">Restore</button>
        <button id="btn-close" type="button" class="slate-btn">Close</button>
        <button id="btn-destroy" type="button" class="slate-btn">Destroy &amp; Unload</button>
        <button id="btn-remount" type="button" class="slate-btn">Re-mount</button>
      </div>

      <div id="host-status" class="slate-log">Sticky Notes ready.</div>
    </section>

    <script type="module">
      import { createStickyNotesWindow } from './sticky-notes.js';

      const statusEl = document.getElementById('host-status');
      const taskStateMap = new Map();
      let stickyWin = null;

      function logStatus(message) {
        statusEl.textContent = message;
      }

      function mountStickyNotes() {
        if (stickyWin) {
          stickyWin.destroy();
        }

        // Uses localStorage automatically when loadNotes/saveNote/deleteNote are omitted,
        // while plugging Slate's task callbacks into onTaskSelected / getTaskStatus.
        stickyWin = createStickyNotesWindow({
          defaultOpen: true,
          onTaskSelected(noteId, task) {
            taskStateMap.set(noteId, {
              selectedTask: task,
              taskStatus: 'queued',
            });
            logStatus(`Slate queued "${task}" for note ${noteId}. Marking done in 1.2s...`);

            setTimeout(() => {
              taskStateMap.set(noteId, {
                selectedTask: task,
                taskStatus: 'done',
                jobStatus: 'tailored',
              });
              stickyWin?.refresh?.();
              logStatus(`Slate completed "${task}" for note ${noteId}.`);
            }, 1200);
          },
          getTaskStatus(noteId) {
            return taskStateMap.get(noteId) || null;
          },
        });
      }

      mountStickyNotes();

      document.getElementById('btn-open').addEventListener('click', () => {
        stickyWin?.open();
        logStatus('Opened Sticky Notes.');
      });
      document.getElementById('btn-min').addEventListener('click', () => {
        stickyWin?.minimize();
        logStatus('Minimized Sticky Notes.');
      });
      document.getElementById('btn-restore').addEventListener('click', () => {
        stickyWin?.restore();
        logStatus('Restored Sticky Notes.');
      });
      document.getElementById('btn-close').addEventListener('click', () => {
        stickyWin?.close();
        logStatus('Closed Sticky Notes.');
      });
      document.getElementById('btn-destroy').addEventListener('click', () => {
        stickyWin?.destroy();
        stickyWin = null;
        logStatus('Destroyed Sticky Notes (DOM nodes and event listeners removed).');
      });
      document.getElementById('btn-remount').addEventListener('click', () => {
        mountStickyNotes();
        stickyWin?.open();
        logStatus('Re-mounted Sticky Notes.');
      });
    </script>
  </body>
</html>
